<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Word Bonds</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Put money behind your word. Lock a bond behind a public promise about your tokens; a TapeOut circuit on X Layer decides if you kept it.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the bond is always a paper certificate (live site); the site around it is open ground. Home leads with one certificate you can break by hand, then the public record as a wall of smaller certificates. */
:root{
  --desk:#dfe5de; --paper:#f4f6f1; --ink:#13231d; --muted:#55655d; --rule:#c3ccc4; --engrave:#0e5b45; --stamp:#b3261e; --wash:#e7ece5;
  --display:"Bodoni Moda","Didot","Bodoni 72",Georgia,serif; --body:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0c1310;--paper:#141d19;--ink:#e3eae4;--muted:#93a39a;--rule:#2b3933;--engrave:#63c29d;--stamp:#f0705f;--wash:#1a2620;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#0c1310;--paper:#141d19;--ink:#e3eae4;--muted:#93a39a;--rule:#2b3933;--engrave:#63c29d;--stamp:#f0705f;--wash:#1a2620;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font:15px/1.55 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--engrave);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.87em;font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.shell{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:28px}

.preview{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;padding-block:12px;border-bottom:1px dashed var(--rule);font-size:13px;color:var(--muted)}
.seg{display:flex;border:1px solid var(--rule);border-radius:999px;overflow:hidden}
.seg button{background:none;border:0;padding:6px 14px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.mark{font:600 22px/1 var(--display);letter-spacing:.01em;text-decoration:none}
.mark i{font-weight:400;color:var(--engrave)}
.nav{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;font-size:14px}
.nav a{text-decoration:none;color:var(--muted)}
.nav a:hover{color:var(--ink)}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:4px;padding:9px 16px;font-weight:500;cursor:pointer}
.btn.line{background:none;color:var(--ink)}
.btn:disabled{border-color:var(--rule);background:var(--wash);color:var(--muted);cursor:not-allowed}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

.cert{background:var(--paper);border:1px solid var(--rule);position:relative;min-width:0}
.cert canvas{display:block;width:100%;height:30px}
.cert-in{padding:26px clamp(18px,4.5vw,44px) 30px;display:flex;flex-direction:column;gap:24px}
.cert-head{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between}
.statement{margin:0;font:400 clamp(27px,4.6vw,44px)/1.14 var(--display);letter-spacing:-.005em;text-wrap:balance;max-width:19em}
.signed{display:flex;flex-wrap:wrap;gap:18px 28px;align-items:center;justify-content:space-between}
.signed dl{margin:0;display:flex;flex-direction:column;gap:10px;min-width:0}
.signed dd{margin:2px 0 0;overflow-wrap:anywhere}
.seal{width:132px;height:132px;flex:none;color:var(--engrave)}
.seal.broken{color:var(--stamp);transform:rotate(-9deg)}
.seal text{font-family:var(--body);fill:currentColor}
.facts{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.facts div{padding:14px 14px 14px 0;min-width:0}
.facts div+div{padding-left:14px;border-left:1px solid var(--rule)}
.facts dd{margin:4px 0 0;font:500 21px/1.2 var(--display);font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.facts dd small{font:400 12px var(--body);color:var(--muted);display:block;margin-top:3px}
@media (max-width:620px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.facts div:nth-child(3){padding-left:0;border-left:0}.facts div:nth-child(n+3){border-top:1px solid var(--rule)}}

.hold{display:flex;flex-direction:column;gap:10px}
.hold-top{display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:space-between;align-items:baseline}
.hold-top b{font:500 21px var(--display);font-variant-numeric:lining-nums tabular-nums}
.meter{position:relative;height:14px;background:var(--wash);border:1px solid var(--rule)}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--engrave)}
.meter.bad i{background:var(--stamp)}
.meter u{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink)}
.scale{position:relative;height:18px;font-size:12px;color:var(--muted)}
.scale span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}

.side{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{display:flex;flex-direction:column;gap:12px;padding-top:14px;border-top:2px solid var(--ink)}
.panel h2{margin:0;font:500 22px/1.2 var(--display)}
.panel p{margin:0;color:var(--muted);font-size:14px}
.kv{margin:0;display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:14px}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.yes{color:var(--stamp);font-weight:600}.ok{color:var(--engrave);font-weight:600}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .btn{width:100%;text-align:center}
.note{font-size:12.5px;color:var(--muted)}

.sec{display:flex;flex-direction:column;gap:12px}
.sec h2{margin:0;font:500 24px/1.2 var(--display)}
.rows{border-top:1px solid var(--rule)}
.row{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 18px;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.row time{color:var(--muted);font-size:13px}
.row a{font-family:var(--mono);font-size:12.5px;color:var(--engrave)}
@media (max-width:620px){.row{grid-template-columns:minmax(0,1fr)}}
.limits{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px 28px}
.limits li{font-size:14px;color:var(--muted);padding-top:10px;border-top:1px solid var(--rule)}
.limits b{display:block;color:var(--ink);font-weight:600;margin-bottom:2px}
@media (max-width:760px){.limits{grid-template-columns:minmax(0,1fr)}}
.foot{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:12.5px;color:var(--muted);padding-top:16px;border-top:1px solid var(--rule)}
.foot span{overflow-wrap:anywhere}

.view{display:flex;flex-direction:column;gap:28px}
.hero{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,.98fr);gap:36px 48px;align-items:center;padding-block:18px 8px}
@media (max-width:900px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero h1{margin:0;font:400 clamp(40px,7vw,76px)/1.0 var(--display);letter-spacing:-.015em;text-wrap:balance}
.hero h1 em{color:var(--engrave)}
.lede{margin:18px 0 0;font-size:17px;line-height:1.55;color:var(--muted);max-width:34em}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.cta .btn{padding:12px 20px;text-decoration:none;display:inline-block}
.demo{position:relative;min-width:0}
.demo .cert{transform:rotate(1.2deg);box-shadow:0 1px 0 var(--rule),0 22px 40px -28px rgba(10,30,22,.55);transition:transform .35s ease}
.demo:hover .cert{transform:rotate(.3deg)}
.demo .cert-in{padding:20px clamp(16px,3vw,28px) 22px;gap:16px}
.demo .statement{font-size:clamp(22px,3vw,29px)}
.demo .signed{align-items:flex-end}
.demo .seal{width:104px;height:104px}
.try{display:flex;flex-direction:column;gap:6px}
.try label{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.try b{font:500 20px var(--display);font-variant-numeric:lining-nums tabular-nums}
input[type=range]{width:100%;accent-color:var(--engrave);margin:0}
.demo.bad input[type=range]{accent-color:var(--stamp)}
.outcome{margin:0;font-size:14px;min-height:3.1em;color:var(--muted)}
.outcome b{color:var(--ink)}
.demo-tag{position:absolute;top:-10px;left:14px;z-index:1;background:var(--ink);color:var(--paper);font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 9px}
@keyframes stamp{0%{transform:scale(1.9) rotate(-22deg);opacity:0}60%{transform:scale(.94) rotate(-9deg);opacity:1}100%{transform:scale(1) rotate(-9deg);opacity:1}}
@keyframes settle{0%{transform:scale(1.25);opacity:0}100%{transform:scale(1);opacity:1}}
.seal.pop{animation:settle .32s ease-out}.seal.broken.pop{animation:stamp .34s cubic-bezier(.2,.9,.3,1.2)}
.meter i{transition:width .25s ease,background .2s}
@media (prefers-reduced-motion:reduce){.seal.pop,.seal.broken.pop{animation:none}.meter i,.demo .cert,.card{transition:none}}

.tally{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--rule)}
.tally div{padding:16px 14px 16px 0;min-width:0}
.tally div+div{padding-left:16px;border-left:1px solid var(--rule)}
.tally dd{margin:4px 0 0;font:500 clamp(22px,3vw,30px)/1.1 var(--display);font-variant-numeric:lining-nums tabular-nums;overflow-wrap:anywhere}
.tally dd small{font:400 13px var(--body);color:var(--muted)}
@media (max-width:700px){.tally{grid-template-columns:repeat(2,minmax(0,1fr))}.tally div{padding-left:0!important;border-left:0!important;border-top:1px solid var(--rule)}.tally div:nth-child(-n+2){border-top:0}.tally div:nth-child(even){padding-left:16px!important;border-left:1px solid var(--rule)!important}.tally div:last-child{grid-column:1/-1}}
.sec-head{display:flex;flex-wrap:wrap;gap:6px 20px;justify-content:space-between;align-items:baseline}
.sec-head p{margin:0;color:var(--muted);font-size:14px}
.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:20px}
.card{background:var(--paper);border:1px solid var(--rule);text-decoration:none;display:flex;flex-direction:column;transition:transform .18s ease,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:var(--ink)}
.card canvas{display:block;width:100%;height:16px}
.card-in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px;flex:1}
.card-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.pill{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:3px 9px;border:1px solid currentColor;color:var(--engrave)}
.pill.broken{color:var(--stamp);transform:rotate(-3deg)}
.card q{font:400 21px/1.2 var(--display);quotes:"“" "”";flex:1}
.card-foot{display:flex;justify-content:space-between;gap:12px;align-items:baseline;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:12px}
.card-foot b{font:500 17px var(--display);color:var(--ink);font-variant-numeric:lining-nums}
.card.ghost{border-style:dashed;background:none;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:8px;min-height:180px;color:var(--muted)}
.card.ghost b{font:500 21px var(--display);color:var(--ink)}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px 32px;counter-reset:s}
.steps li{counter-increment:s;border-top:1px solid var(--rule);padding-top:14px;color:var(--muted);font-size:15px}
.steps li::before{content:counter(s);display:block;font:400 34px/1 var(--display);color:var(--engrave);margin-bottom:8px}
.steps b{display:block;color:var(--ink);font:500 21px/1.25 var(--display);margin-bottom:4px}
@media (max-width:760px){.steps{grid-template-columns:minmax(0,1fr)}}
.who{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);background:var(--paper)}
.who div{padding:20px 22px;min-width:0;font-size:15px;color:var(--muted)}
.who div+div{border-left:1px solid var(--rule)}
.who b{display:block;font:500 21px var(--display);color:var(--ink);margin-bottom:6px}
@media (max-width:760px){.who{grid-template-columns:minmax(0,1fr)}.who div+div{border-left:0;border-top:1px solid var(--rule)}}
.back{font-size:14px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.soon{padding:48px 0;text-align:center;color:var(--muted)}
.soon h2{font:500 30px var(--display);color:var(--ink);margin:0 0 8px}

.nav a.on{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
.page-title{margin:0;font:400 clamp(32px,5vw,50px)/1.05 var(--display);letter-spacing:-.01em;text-wrap:balance}
.hint{margin:4px 0 0;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink);font-weight:600}
.bad{color:var(--stamp);font-weight:500}
.loading{display:flex;gap:10px;align-items:center;color:var(--muted);padding:28px 0}
.loading .dot{width:8px;height:8px;border-radius:50%;background:var(--engrave);animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}
.toast{position:fixed;z-index:20;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:min(420px,calc(100vw - 32px));background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:6px;display:flex;flex-direction:column;gap:4px;font-size:14px;box-shadow:0 12px 30px -14px rgba(0,0,0,.5)}
.toast a{color:inherit;opacity:.8;font-size:13px}
.toast.ok{border-left:4px solid var(--engrave)}.toast.bad{border-left:4px solid var(--stamp)}
.btn.big{padding:14px 20px;font-size:16px;width:100%}
a.btn{text-decoration:none;text-align:center;display:inline-block}
.card-by{font-size:13px;color:var(--muted)}
.handle{font-weight:600;text-decoration:none}
.who-link{text-decoration:none}
.signed dd a{text-decoration:none}
.signed dd a:hover,.who-link:hover,.handle:hover{text-decoration:underline}

.make{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:32px;align-items:start}
@media (max-width:900px){.make{grid-template-columns:minmax(0,1fr)}.preview-col{order:-1}}
.form{display:flex;flex-direction:column;gap:18px;min-width:0}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label{font-weight:600;font-size:14px}
.form input,.form select,.form textarea,.q input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);color:var(--ink);font:15px var(--body)}
.form textarea,.form input.mono,.q input.mono{font-family:var(--mono);font-size:13px}
.form input:focus,.form select:focus,.form textarea:focus,.q input:focus{outline:2px solid var(--engrave);outline-offset:0;border-color:transparent}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:480px){.two{grid-template-columns:minmax(0,1fr)}}
.suffix{position:relative}
.suffix input{padding-right:56px}
.suffix span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
.sum{background:var(--wash);border:1px solid var(--rule);padding:14px 16px;font-size:14px;color:var(--muted);line-height:1.6}
.sum b{color:var(--ink)}
.preview-col{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:900px){.preview-col{position:static}}
.seal.draft{color:var(--muted)}

.lookup{max-width:680px;display:flex;flex-direction:column;gap:14px;padding-block:20px}
.lookup .lede{margin:0}
.q{display:flex;gap:8px}
.q input{flex:1;min-width:0}
.maker{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px 40px;align-items:end;padding-top:12px}
@media (max-width:820px){.maker{grid-template-columns:minmax(0,1fr)}}
.maker-id{display:flex;flex-direction:column;gap:6px;min-width:0}
.maker-id .addr{margin:0;overflow-wrap:anywhere}
.page-title.title-addr{font:500 clamp(26px,3.6vw,38px)/1.1 var(--mono);letter-spacing:-.02em}
.maker-id .addr a{color:var(--muted)}
.tally.small{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:700px){.tally.small{grid-template-columns:repeat(2,minmax(0,1fr))}.tally.small div:last-child{grid-column:auto}}
.claim{background:var(--paper);border:1px solid var(--rule);padding:22px clamp(16px,3vw,28px);display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:20px 32px}
@media (max-width:820px){.claim{grid-template-columns:minmax(0,1fr)}}
.claim h2{margin:6px 0 4px;font:500 26px var(--display)}
.claim-steps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:16px;counter-reset:c}
.claim-steps li{counter-increment:c;display:flex;flex-direction:column;gap:8px;padding-left:34px;position:relative}
.claim-steps li::before{content:counter(c);position:absolute;left:0;top:-4px;font:400 26px var(--display);color:var(--engrave)}
.claim-steps .btn{align-self:flex-start}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <a class="mark" href="#home">Word <i>Bonds</i></a>
    <nav class="nav"><a href="#home" data-nav="home">The record</a><a href="#make" data-nav="make">Make a bond</a><a href="#maker" data-nav="maker">Look up a maker</a><a href="#home" id="mine" data-nav="mine" hidden>My record</a><button class="btn line" id="connect">Connect wallet</button></nav>
  </header>
  <main class="view" id="app"></main>
  <footer class="foot">
    <span id="f-contract"></span>
    <span>Verdicts by TapeOut circuit 19 on X Layer. 119 gates, no memory, no admin override.</span>
    <span>Unaudited. Bond only what you can lose.</span>
  </footer>
</div>
